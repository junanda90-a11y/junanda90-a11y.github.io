<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survei Lapangan</title>
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#1d2b24;--mut:#5d6d64;--line:#cfd9d0;--ac:#1f6b54;--ac2:#e9f2ed;--warn:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a16;--card:#1c2621;--ink:#e6eee9;--mut:#9bb0a5;--line:#2f3d36;--ac:#58c29e;--ac2:#223a30;--warn:#ef8d78}}
:root[data-theme="dark"]{--bg:#131a16;--card:#1c2621;--ink:#e6eee9;--mut:#9bb0a5;--line:#2f3d36;--ac:#58c29e;--ac2:#223a30;--warn:#ef8d78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px}
.row{display:flex;gap:10px}.row>*{flex:1}
button.p,button.s{padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer;border:1px solid var(--ac)}
button.p{background:var(--ac);color:#fff}
button.s{background:var(--ac2);color:var(--ac)}
button.d{background:none;border:none;color:var(--warn);cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.status{font-size:.9rem;color:var(--mut);margin:8px 0 0}
.status.err{color:var(--warn)}
.gps{margin-top:10px;padding:10px;border-radius:8px;background:var(--ac2);font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.photos figcaption{font-size:.75rem;color:var(--mut)}
.photos .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer}
.rec{border-top:1px solid var(--line);padding:12px 0}
.rec:first-child{border-top:none}
.rec b{display:block}
.rec small{color:var(--mut)}
.rec .thumbs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.rec .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Survei Lapangan</h1>
<p class="sub">Catat lokasi, isi data, dan ambil foto yang otomatis bergeotag.</p>

<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Form survei</button>
<button role="tab" id="t2" aria-selected="false">Tersimpan (<span id="cnt">0</span>)</button>
</div>

<div id="v1">
<section class="panel">
<h2>Lokasi</h2>
<button class="p" id="btnGps" type="button">Ambil lokasi saya</button>
<div class="gps" id="gps" hidden></div>
<p class="status" id="gpsMsg"></p>
<div class="row">
<div><label for="lat">Latitude</label><input id="lat" inputmode="decimal" placeholder="-2.1316"></div>
<div><label for="lng">Longitude</label><input id="lng" inputmode="decimal" placeholder="106.1169"></div>
</div>
<p class="status">Jika GPS tidak tersedia, isi koordinat secara manual.</p>
</section>

<section class="panel">
<h2>Data survei</h2>
<label for="nama">Nama lokasi</label><input id="nama" placeholder="Contoh: Jembatan Kampung Baru">
<label for="surveyor">Nama surveyor</label><input id="surveyor">
<label for="kat">Kategori</label>
<select id="kat"><option>Infrastruktur</option><option>Lingkungan</option><option>Permukiman</option><option>Fasilitas umum</option><option>Lainnya</option></select>
<label for="kon">Kondisi</label>
<select id="kon"><option>Baik</option><option>Cukup</option><option>Rusak ringan</option><option>Rusak berat</option></select>
<label for="cat">Catatan</label><textarea id="cat"></textarea>
</section>

<section class="panel">
<h2>Foto bergeotag</h2>
<input type="file" id="file" accept="image/*" capture="environment" multiple hidden>
<button class="s" id="btnFoto" type="button">Ambil / pilih foto</button>
<p class="status" id="fotoMsg">Koordinat dan waktu dicetak di foto dan disimpan bersama data.</p>
<div class="photos" id="photos"></div>
</section>

<button class="p" id="save" type="button" style="width:100%">Simpan survei</button>
<p class="status" id="saveMsg" role="status"></p>
</div>

<div id="v2" hidden>
<section class="panel">
<div class="row" style="margin-bottom:8px">
<button class="s" id="exCsv" type="button">Salin CSV</button>
<button class="s" id="exJson" type="button">Salin JSON</button>
</div>
<p class="status" id="exMsg" role="status">Tempel hasil salinan ke Excel/Sheets atau berkas teks.</p>
<div id="list"></div>
</section>
</div>
</main>

<script>
(function(){
var KEY="survei_v1",$=function(i){return document.getElementById(i)};
var photos=[],records=[],pos=null;

// storage aman
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){records=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){return false}}

// tab
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;
$("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);if(n===2)render()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};

// GPS
function setPos(lat,lng,acc){pos={lat:lat,lng:lng,acc:acc};
$("lat").value=lat.toFixed(6);$("lng").value=lng.toFixed(6);
$("gps").hidden=false;$("gps").textContent=lat.toFixed(6)+", "+lng.toFixed(6)+(acc?" (akurasi ±"+Math.round(acc)+" m)":"")}
function getGps(cb){
if(!navigator.geolocation){$("gpsMsg").textContent="Perangkat tidak mendukung GPS. Isi koordinat manual.";$("gpsMsg").className="status err";cb&&cb(false);return}
$("gpsMsg").className="status";$("gpsMsg").textContent="Mencari lokasi…";
navigator.geolocation.getCurrentPosition(function(p){
setPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy);$("gpsMsg").textContent="Lokasi didapat.";cb&&cb(true)},
function(e){$("gpsMsg").className="status err";
$("gpsMsg").textContent=e.code===1?"Izin lokasi ditolak. Aktifkan izin lokasi di browser atau isi koordinat manual.":"Lokasi tidak bisa diambil. Coba lagi atau isi manual.";cb&&cb(false)},
{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
$("btnGps").onclick=function(){getGps()};
function manual(){var a=parseFloat($("lat").value),b=parseFloat($("lng").value);
if(isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180){pos={lat:a,lng:b,acc:null};return true}return false}
$("lat").oninput=$("lng").oninput=manual;

// foto
$("btnFoto").onclick=function(){
if(!manual()){getGps(function(ok){if(ok||manual())$("file").click();else{$("fotoMsg").className="status err";$("fotoMsg").textContent="Isi lokasi dulu agar foto bisa diberi geotag."}})}
else $("file").click()};
$("file").onchange=function(){
var fs=[].slice.call(this.files);this.value="";
var snap=pos&&{lat:pos.lat,lng:pos.lng,acc:pos.acc};
if(!snap)return;
var tasks=fs.map(function(f){return stamp(f,snap)});
Promise.all(tasks).then(function(r){photos=photos.concat(r);drawPhotos()})};
function stamp(file,p){return new Promise(function(res){
var img=new Image(),u=URL.createObjectURL(file);
img.onload=function(){
var m=1280,s=Math.min(1,m/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d");g.drawImage(img,0,0,w,h);
var t=new Date(),ts=t.toLocaleString("id-ID"),line1=p.lat.toFixed(6)+", "+p.lng.toFixed(6),fs=Math.max(14,Math.round(w/38));
g.font="600 "+fs+"px sans-serif";var bh=fs*2.6;
g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,h-bh,w,bh);
g.fillStyle="#fff";g.textBaseline="top";g.fillText(line1,fs*.6,h-bh+fs*.35);g.fillText(ts,fs*.6,h-bh+fs*1.4);
URL.revokeObjectURL(u);
res({data:c.toDataURL("image/jpeg",.7),lat:p.lat,lng:p.lng,time:t.toISOString()})};
img.onerror=function(){URL.revokeObjectURL(u);res(null)};img.src=u})}
function drawPhotos(){photos=photos.filter(Boolean);var box=$("photos");box.innerHTML="";
photos.forEach(function(p,i){var f=document.createElement("figure"),im=document.createElement("img");
im.src=p.data;im.alt="Foto "+(i+1);var x=document.createElement("button");x.className="x";x.type="button";x.textContent="×";x.setAttribute("aria-label","Hapus foto "+(i+1));
x.onclick=function(){photos.splice(i,1);drawPhotos()};
var cp=document.createElement("figcaption");cp.textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5);
f.appendChild(im);f.appendChild(x);f.appendChild(cp);box.appendChild(f)});
$("fotoMsg").className="status";$("fotoMsg").textContent=photos.length?photos.length+" foto siap disimpan.":"Koordinat dan waktu dicetak di foto dan disimpan bersama data."}

// simpan
$("save").onclick=function(){var m=$("saveMsg");m.className="status err";
if(!$("nama").value.trim()){m.textContent="Isi nama lokasi.";$("nama").focus();return}
if(!manual()){m.textContent="Lokasi belum diisi. Ambil lokasi atau isi koordinat.";return}
records.unshift({id:Date.now(),nama:$("nama").value.trim(),surveyor:$("surveyor").value.trim(),kategori:$("kat").value,kondisi:$("kon").value,catatan:$("cat").value.trim(),lat:pos.lat,lng:pos.lng,akurasi:pos.acc,waktu:new Date().toISOString(),foto:photos});
if(!persist()){records.shift();m.textContent="Penyimpanan penuh. Hapus data lama atau kurangi jumlah foto.";return}
photos=[];drawPhotos();["nama","cat"].forEach(function(i){$(i).value=""});
m.className="status";m.textContent="Survei tersimpan.";count()};
function count(){$("cnt").textContent=records.length}

// daftar
function render(){var l=$("list");l.innerHTML="";
if(!records.length){l.innerHTML='<p class="empty">Belum ada survei. Isi form untuk mulai.</p>';return}
records.forEach(function(r){var d=document.createElement("div");d.className="rec";
var b=document.createElement("b");b.textContent=r.nama;d.appendChild(b);
var s=document.createElement("small");s.textContent=r.kategori+", "+r.kondisi+" | "+new Date(r.waktu).toLocaleString("id-ID")+(r.surveyor?" | "+r.surveyor:"");d.appendChild(s);
var a=document.createElement("div");a.textContent=r.lat.toFixed(6)+", "+r.lng.toFixed(6);d.appendChild(a);
if(r.catatan){var n=document.createElement("div");n.textContent=r.catatan;d.appendChild(n)}
var th=document.createElement("div");th.className="thumbs";r.foto.forEach(function(p){var i=document.createElement("img");i.src=p.data;i.alt="Foto survei";th.appendChild(i)});d.appendChild(th);
var mp=document.createElement("a");mp.href="https://www.openstreetmap.org/?mlat="+r.lat+"&mlon="+r.lng+"#map=17/"+r.lat+"/"+r.lng;mp.target="_blank";mp.rel="noopener";mp.textContent="Lihat di peta";mp.style.marginRight="14px";mp.style.color="var(--ac)";d.appendChild(mp);
var del=document.createElement("button");del.className="d";del.type="button";del.textContent="Hapus";
del.onclick=function(){if(confirm("Hapus survei ini?")){records=records.filter(function(x){return x.id!==r.id});persist();count();render()}};d.appendChild(del);
l.appendChild(d)})}

// ekspor
function copy(t,msg){function ok(){$("exMsg").textContent=msg}
function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){$("exMsg").textContent="Gagal menyalin."}a.remove()}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
function q(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
$("exCsv").onclick=function(){if(!records.length){$("exMsg").textContent="Belum ada data.";return}
var h=["nama","surveyor","kategori","kondisi","catatan","lat","lng","akurasi_m","waktu","jumlah_foto"];
var rows=records.map(function(r){return [r.nama,r.surveyor,r.kategori,r.kondisi,r.catatan,r.lat,r.lng,r.akurasi,r.waktu,r.foto.length].map(q).join(",")});
copy([h.join(",")].concat(rows).join("\n"),"CSV disalin ("+records.length+" baris).")};
$("exJson").onclick=function(){if(!records.length){$("exMsg").textContent="Belum ada data.";return}
copy(JSON.stringify(records.map(function(r){var c=Object.assign({},r);c.foto=r.foto.map(function(p){return{lat:p.lat,lng:p.lng,time:p.time}});return c}),null,1),"JSON disalin (tanpa data gambar).")};

load();count();
})();
</script>
</body>
</html>
